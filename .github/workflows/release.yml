name: release

on:
  push:
    tags:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v2
      with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 8.0.x
    
    - name: Pack
      run: dotnet pack -c Release
    
    - name: Push to NuGet
      run: dotnet nuget push **\*.nupkg -s 'https://api.nuget.org/v3/index.json' -k ${{secrets.NUGET_API_KEY}}
    - name: Push to GitHub Packages
      run: dotnet nuget push **\*.nupkg -s 'https://nuget.pkg.github.com/yapoml/index.json' -k ${{secrets.GITHUB_TOKEN}}
